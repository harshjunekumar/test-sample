<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;font-weight:700;src:url(../coloring-book/kdp/fonts/Fredoka-Bold.ttf)}
@font-face{font-family:Fredoka;font-weight:500;src:url(../coloring-book/kdp/fonts/Fredoka-Medium.ttf)}
html,body{margin:0;background:#000}
canvas{display:block;width:540px;height:960px}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Count to 10 with Pip" — 60 s, 1080x1920 (9:16). render(t) draws one frame deterministically.
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1080, H = 1920, OUT = '#2B2D42';
let TL = null;                       // timeline.json injected by the renderer
const NUMW = ['ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN'];
const RAINBOW = ['#FF4D6D','#FF8C42','#FFC93C','#5BD46A','#3EC1F3','#4D7CFE','#9B5DE5','#F15BB5','#00BBA7','#FF6B35'];

// ---------------------------------------------------------------- utils
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const backOut = x => { if (x <= 0) return 0; if (x >= 1) return 1; const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * 2 * Math.PI / 3) + 1;
function rnd(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }

function grad(x, y, r, light, base, dark) {
  const g = X.createRadialGradient(x - r * .35, y - r * .45, r * .08, x, y, r * 1.08);
  g.addColorStop(0, light); g.addColorStop(.5, base); g.addColorStop(1, dark); return g;
}
function ell(x, y, rx, ry, fill, lw = 6, rot = 0) {
  X.beginPath(); X.ellipse(x, y, Math.max(rx, .1), Math.max(ry, .1), rot, 0, Math.PI * 2);
  X.fillStyle = fill; X.fill(); if (lw) { X.lineWidth = lw; X.strokeStyle = OUT; X.stroke(); }
}
function ball(x, y, r, light, base, dark, lw = 6) { ell(x, y, r, r, grad(x, y, r, light, base, dark), lw); }
function shine(x, y, rx, ry, a = .6, rot = -.5) { X.save(); X.globalAlpha = a; ell(x, y, rx, ry, '#fff', 0, rot); X.restore(); }
function ground(x, y, rx, a = .2) { X.save(); X.globalAlpha = a; ell(x, y, rx, rx * .22, '#1d3b2a', 0); X.restore(); }
function rrect(x, y, w, h, r, fill, lw = 6) {
  X.beginPath(); X.roundRect(x, y, w, h, r); X.fillStyle = fill; X.fill();
  if (lw) { X.lineWidth = lw; X.strokeStyle = OUT; X.stroke(); }
}
function label(str, x, y, size, fill, opts = {}) {
  const { halo = true, lw = Math.max(6, size * .09), weight = 700, align = 'center' } = opts;
  X.font = `${weight} ${size}px Fredoka`; X.textAlign = align; X.textBaseline = 'middle'; X.lineJoin = 'round';
  if (halo) { X.lineWidth = lw * 3.2; X.strokeStyle = '#fff'; X.strokeText(str, x, y); }
  X.lineWidth = lw; X.strokeStyle = OUT; X.strokeText(str, x, y);
  X.fillStyle = fill; X.fillText(str, x, y);
}
function rainbowWord(str, x, y, size, offset = 0) {
  X.font = `700 ${size}px Fredoka`;
  const widths = [...str].map(ch => X.measureText(ch).width), total = widths.reduce((a, b) => a + b, 0);
  let cx = x - total / 2;
  [...str].forEach((ch, i) => { label(ch, cx + widths[i] / 2, y, size, RAINBOW[(i + offset) % RAINBOW.length]); cx += widths[i]; });
}
function starPath(x, y, r, inner = .48, rot = 0) {
  X.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + rot + i * Math.PI / 5, rr = i % 2 ? r * inner : r;
    X.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a));
  }
  X.closePath();
}
function star3d(x, y, r, rot = 0, glow = 0) {
  X.save();
  if (glow) { X.shadowColor = 'rgba(255,230,120,.9)'; X.shadowBlur = 40 * glow; }
  starPath(x, y, r, .5, rot); X.fillStyle = grad(x, y, r, '#FFF6B0', '#FFD23F', '#F4A100'); X.fill();
  X.restore(); starPath(x, y, r, .5, rot); X.lineWidth = 7; X.strokeStyle = OUT; X.stroke();
  shine(x - r * .25, y - r * .25, r * .16, r * .09, .7);
}

// ---------------------------------------------------------------- characters & props
function apple(x, y, r, sq = 0) {
  X.save(); X.translate(x, y); X.scale(1 + sq * .25, 1 - sq * .25);
  ball(0, 0, r, '#FF9AA2', '#F0353B', '#A3121B');
  X.beginPath(); X.moveTo(0, -r * .85); X.quadraticCurveTo(r * .1, -r * 1.25, r * .25, -r * 1.35);
  X.lineWidth = 7; X.strokeStyle = '#6B3E26'; X.lineCap = 'round'; X.stroke();
  ell(r * .45, -r * 1.05, r * .38, r * .18, grad(r * .45, -r * 1.05, r * .38, '#B9F6A6', '#4CBF56', '#2D8A3A'), 4, -.5);
  shine(-r * .35, -r * .35, r * .22, r * .13, .75);
  X.restore();
}

function balloon(x, y, r, color, dark, n, t) {
  const sway = Math.sin(t * 2 + n) * 6;
  X.beginPath(); X.moveTo(x, y + r * 1.15); X.bezierCurveTo(x + 20 + sway, y + r * 1.6, x - 20 - sway, y + r * 2, x + sway, y + r * 2.5);
  X.lineWidth = 4; X.strokeStyle = OUT; X.stroke();
  X.beginPath(); X.moveTo(x - 12, y + r * 1.2); X.lineTo(x + 12, y + r * 1.2); X.lineTo(x, y + r * 1.05); X.closePath();
  X.fillStyle = dark; X.fill(); X.lineWidth = 4; X.stroke();
  ell(x, y, r * .9, r * 1.1, grad(x, y, r, '#ffffff', color, dark), 6);
  shine(x - r * .35, y - r * .45, r * .16, r * .28, .6, .3);
  label(String(n), x, y + 4, r * 1.0, '#fff', { halo: false, lw: 8 });
}

const TAN = ['#FFE0B0', '#F5B971', '#C9853F'], BROWN = ['#D9A070', '#A86A3D', '#6E3F1E'], CREAM = ['#FFFFFF', '#FFF3DC', '#E9CFA6'];
function pip(x, y, s, t, mouth, opts = {}) {
  const { wave = 0, jump = 0, look = 0 } = opts;
  X.save(); X.translate(x, y - jump); X.scale(s, s);
  const bob = Math.sin(t * 4) * 4 - clamp(mouth) * 6; X.translate(0, bob);
  // shadow
  X.save(); X.translate(0, -bob + jump / s); ground(0, 330, 150, .22 * (1 - Math.min(jump / 300, .6))); X.restore();
  // tail
  const wag = Math.sin(t * 12) * .45;
  X.save(); X.translate(85, 220); X.rotate(-.9 + wag);
  ell(0, -55, 22, 62, grad(0, -55, 60, ...TAN), 6); X.restore();
  // back legs, body, belly
  ell(-92, 290, 56, 34, grad(-92, 290, 56, ...TAN)); ell(92, 290, 56, 34, grad(92, 290, 56, ...TAN));
  ell(0, 200, 108, 112, grad(0, 200, 112, ...TAN));
  ell(0, 225, 58, 70, grad(0, 225, 70, ...CREAM), 5);
  // front legs + paws
  for (const sx of [-1, 1]) {
    if (sx === 1 && wave) continue;
    X.beginPath(); X.roundRect(sx * 42 - 22, 180, 44, 112, 22); X.fillStyle = grad(sx * 42, 220, 60, ...TAN); X.fill();
    X.lineWidth = 6; X.strokeStyle = OUT; X.stroke();
    ell(sx * 42, 298, 38, 22, grad(sx * 42, 298, 38, ...CREAM));
  }
  // waving arm
  if (wave) {
    X.save(); X.translate(70, 160); X.rotate(-2.3 + Math.sin(t * 9) * .35 * wave);
    X.beginPath(); X.roundRect(-22, 0, 44, 120, 22); X.fillStyle = grad(0, 60, 70, ...TAN); X.fill(); X.lineWidth = 6; X.strokeStyle = OUT; X.stroke();
    ell(0, 122, 32, 30, grad(0, 122, 32, ...CREAM)); X.restore();
  }
  // collar + tag
  X.beginPath(); X.ellipse(0, 105, 92, 34, 0, 0, Math.PI); X.lineWidth = 26; X.strokeStyle = OUT; X.stroke();
  X.lineWidth = 16; X.strokeStyle = '#EF476F'; X.stroke();
  ball(0, 148, 20, '#FFF5C2', '#FFD166', '#D99A00', 5);
  // head
  ell(0, 0, 138, 120, grad(0, 0, 138, ...TAN));
  // floppy ears hanging over the sides of the head
  const flap = Math.sin(t * 5) * .07;
  for (const sx of [-1, 1]) {
    X.save(); X.translate(sx * 92, -92); X.rotate(sx * (.18 + flap));
    X.beginPath(); X.moveTo(-sx * 10, 0); X.bezierCurveTo(sx * 85, -20, sx * 95, 150, sx * 45, 200);
    X.bezierCurveTo(sx * 10, 235, sx * -20, 160, sx * -12, 70); X.closePath();
    X.fillStyle = grad(sx * 35, 90, 120, ...BROWN); X.fill(); X.lineWidth = 6; X.strokeStyle = OUT; X.stroke(); X.restore();
  }
  // cute face: big sparkly eyes, closed smile, rosy cheeks (talking = gentle nod + smile stretch)
  const m = clamp(mouth);
  const bl = (t % 3.3) < .14;
  X.lineCap = 'round'; X.lineJoin = 'round';
  for (const ex of [-50, 50]) {
    const lx = ex + look * 5;
    if (bl) {                                   // happy closed-eye blink
      X.beginPath(); X.arc(lx, -6, 20, Math.PI * 1.1, Math.PI * 1.9); X.lineWidth = 7; X.strokeStyle = OUT; X.stroke();
    } else {
      ell(lx, -8, 26, 31, grad(lx, -8, 31, '#5A4A6B', '#2A2238', '#120E1A'), 0);
      ell(lx - 9, -19, 11, 12, '#fff', 0);      // big sparkle
      ell(lx + 10, 6, 5, 5, '#fff', 0);         // small sparkle
    }
  }
  X.save(); X.globalAlpha = .6; ell(-88, 34, 26, 15, '#FF8FAB', 0); ell(88, 34, 26, 15, '#FF8FAB', 0); X.restore();
  ell(0, 50, 58, 40, grad(0, 50, 58, ...CREAM), 5);                        // muzzle
  const w = 18 + m * 6;
  X.beginPath(); X.moveTo(-w, 52); X.quadraticCurveTo(-w / 2, 66 + m * 3, 0, 54); X.quadraticCurveTo(w / 2, 66 + m * 3, w, 52);
  X.lineWidth = 5.5; X.strokeStyle = OUT; X.stroke();                     // closed ":3" puppy smile
  X.beginPath(); X.moveTo(0, 40); X.lineTo(0, 54); X.lineWidth = 5; X.stroke();
  ell(0, 34, 17, 12, grad(0, 34, 17, '#7A6A80', '#3A2F45', '#1A1420'), 0); shine(-6, 30, 6, 3, .8, 0);  // little nose
  X.restore();
}

// ---------------------------------------------------------------- backgrounds
function cloud(x, y, s, a = 1) {
  X.save(); X.globalAlpha = a; X.translate(x, y); X.scale(s, s);
  X.fillStyle = '#fff'; X.strokeStyle = 'rgba(43,45,66,.25)'; X.lineWidth = 5;
  X.beginPath(); for (const [cx, cy, r] of [[-70, 10, 45], [-20, -20, 60], [45, -5, 50], [85, 20, 35], [0, 25, 50]]) { X.moveTo(cx + r, cy); X.arc(cx, cy, r, 0, 7); }
  X.fill(); X.restore();
}
function sunDraw(x, y, r, t) {
  X.save(); X.translate(x, y); X.rotate(t * .25);
  for (let i = 0; i < 12; i++) { X.rotate(Math.PI / 6); X.beginPath(); X.moveTo(r + 10, -14); X.lineTo(r + 50, 0); X.lineTo(r + 10, 14); X.closePath(); X.fillStyle = '#FFC93C'; X.fill(); X.lineWidth = 5; X.strokeStyle = OUT; X.stroke(); }
  X.restore();
  ball(x, y, r, '#FFF8C4', '#FFD23F', '#F2A900');
  ell(x - 22, y - 8, 7, 9, OUT, 0); ell(x + 22, y - 8, 7, 9, OUT, 0);
  X.beginPath(); X.arc(x, y + 8, 18, .2, Math.PI - .2); X.lineWidth = 5; X.strokeStyle = OUT; X.stroke();
}
function flowerDraw(x, y, s, c, t) {
  X.save(); X.translate(x, y); X.rotate(Math.sin(t * 2 + x) * .06); X.scale(s, s);
  X.beginPath(); X.moveTo(0, 0); X.lineTo(0, -90); X.lineWidth = 8; X.strokeStyle = '#2D8A3A'; X.stroke();
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ell(Math.cos(a) * 26, -90 + Math.sin(a) * 26, 20, 14, c, 4, a); }
  ball(0, -90, 16, '#FFF6B0', '#FFD23F', '#F4A100', 4);
  X.restore();
}
function landscape(t, night) {
  const g = X.createLinearGradient(0, 0, 0, 1150);
  if (night) { g.addColorStop(0, '#1B1F4B'); g.addColorStop(1, '#6A4FB0'); }
  else { g.addColorStop(0, '#5BBEFF'); g.addColorStop(1, '#CFF0FF'); }
  X.fillStyle = g; X.fillRect(-200, -200, W + 400, H + 400);
  if (night) {
    const r = rnd(3);
    for (let i = 0; i < 70; i++) { const sx = r() * W, sy = r() * 1000, tw = .4 + .6 * Math.abs(Math.sin(t * 2 + i)); X.globalAlpha = tw; ell(sx, sy, 3, 3, '#fff', 0); }
    X.globalAlpha = 1;
    ball(930, 200, 70, '#FFFBE6', '#FFF1B8', '#E8D58A', 5); ell(905, 185, 14, 14, 'rgba(0,0,0,.08)', 0); ell(950, 225, 10, 10, 'rgba(0,0,0,.08)', 0);
  } else {
    sunDraw(975, 330, 62, t);
    cloud(((t * 18) % 1400) - 200, 360, 1.0); cloud(((t * 12 + 700) % 1400) - 200, 500, .8); cloud(((t * 9 + 300) % 1400) - 200, 650, .65, .9);
  }
  const hill = (y, amp, c1, c2, ph) => {
    const gg = X.createLinearGradient(0, y - amp, 0, y + 300); gg.addColorStop(0, c1); gg.addColorStop(1, c2);
    X.beginPath(); X.moveTo(-200, H + 200); X.lineTo(-200, y);
    for (let xx = -200; xx <= W + 200; xx += 20) X.lineTo(xx, y - amp * Math.sin((xx + ph) / 260));
    X.lineTo(W + 200, H + 200); X.closePath(); X.fillStyle = gg; X.fill(); X.lineWidth = 6; X.strokeStyle = OUT; X.stroke();
  };
  if (night) { hill(1040, 40, '#3E7A5A', '#2B5A43', 100); hill(1110, 25, '#4E9A6E', '#2F6B4C', 520); }
  else { hill(1040, 40, '#9BE39A', '#5DBB6E', 100); hill(1110, 25, '#7BD389', '#3FA35A', 520); }
  const fl = ['#FF6B9A', '#FFD23F', '#B28DFF', '#FF8C42', '#3EC1F3'];
  for (let i = 0; i < 7; i++) flowerDraw(70 + i * 157, 1800 + (i % 2) * 50, .9, fl[i % 5], t);
}

function tree(cx, cy, s) {
  X.save(); X.translate(cx, cy); X.scale(s, s);
  X.beginPath(); X.moveTo(-45, 380); X.quadraticCurveTo(-30, 200, -38, 60); X.lineTo(38, 60); X.quadraticCurveTo(30, 200, 45, 380); X.closePath();
  const tg = X.createLinearGradient(-45, 0, 45, 0); tg.addColorStop(0, '#C98A55'); tg.addColorStop(.5, '#A86A3D'); tg.addColorStop(1, '#6E3F1E');
  X.fillStyle = tg; X.fill(); X.lineWidth = 6; X.strokeStyle = OUT; X.stroke();
  const puffs = [[-120, 40, 110], [120, 40, 110], [-70, -90, 120], [75, -95, 120], [0, -150, 105], [0, 30, 140]];
  X.beginPath(); for (const [x, y, r] of puffs) { X.moveTo(x + r + 3, y); X.arc(x, y, r + 3, 0, 7); }
  X.lineWidth = 12; X.strokeStyle = OUT; X.stroke();
  for (const [x, y, r] of puffs) ell(x, y, r, r, grad(x, y, r, '#B6F2A0', '#58C468', '#2F8F45'), 0);
  X.restore();
}

// ---------------------------------------------------------------- layout constants
const TREE = { x: 750, y: 720 };
const APPLE_ON_TREE = [[-120, -60], [-40, -140], [60, -120], [140, -40], [-150, 40], [-60, 5], [45, -25], [130, 60], [-90, 100], [20, 95]];
const FRAME = { x: 90, y: 1130, w: 900, h: 360 };
const cell = i => ({ x: 184 + (i % 5) * 178, y: 1226 + Math.floor(i / 5) * 168 });
const STARS = [[480, 430], [810, 370], [640, 700], [905, 820]];

function captionFor(t) {
  // number words for counting lines, otherwise the line caption
  const L = TL.lines;
  for (let k = L.length - 1; k >= 0; k--) {
    const ln = L[k];
    if (t >= ln.start - .1) {
      const next = L[k + 1];
      const until = next ? Math.min(ln.end + .9, next.start - .1) : ln.end + 2;
      if (t > until) return null;
      if (ln.caption) return { text: ln.caption, k, color: OUT };
      const n = NUMW.indexOf(ln.text.replace('!', '').toUpperCase());
      if (n >= 0) return { text: NUMW[n], k, color: RAINBOW[n], big: true };
      return null;
    }
  }
  return null;
}

// ---------------------------------------------------------------- frame
function render(t) {
  const f = Math.min(Math.floor(t * 30), TL.mouth.length - 1), mouth = TL.mouth[f];
  const ct0 = TL.count_t0, cst = TL.count_step, ft0 = TL.fast_t0, fst = TL.fast_step, qt0 = TL.quiz_t0, qst = TL.quiz_step;
  const scene = t < 35 ? 'apples' : t < 45 ? 'quiz' : 'party';
  X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, W, H);

  // camera: gentle push-ins per scene
  let cs = 1, fx = W / 2, fy = H / 2;
  if (scene === 'apples') { cs = t < 14.6 ? lerp(1, 1.03, inOut(prog(t, 0, 14.6))) : lerp(1.03, 1.07, inOut(prog(t, 14.6, 33))); fy = lerp(900, 1150, inOut(prog(t, 12, 16))); }
  else if (scene === 'quiz') { cs = lerp(1.0, 1.05, inOut(prog(t, 35, 45))); fy = 800; }
  else { cs = t < 55 ? 1.0 : 1 + .02 * Math.sin((t - 55) * 9) * (1 - prog(t, 55, 56.5)); }
  X.translate(fx, fy); X.scale(cs, cs); X.translate(-fx, -fy);

  landscape(t, scene === 'quiz');

  if (scene === 'apples') {
    const ts = backOut(prog(t, .1, 1.1));
    tree(TREE.x, TREE.y, Math.max(ts, .001));
    // ten-frame board
    const fb = backOut(prog(t, 10.3, 11.0));
    if (fb > 0) {
      X.save(); X.translate(0, (1 - fb) * 700);
      rrect(FRAME.x + 8, FRAME.y + 12, FRAME.w, FRAME.h, 34, 'rgba(0,0,0,.18)', 0);
      const bg = X.createLinearGradient(0, FRAME.y, 0, FRAME.y + FRAME.h); bg.addColorStop(0, '#E9B074'); bg.addColorStop(1, '#C27C3E');
      rrect(FRAME.x, FRAME.y, FRAME.w, FRAME.h, 34, bg, 7);
      for (let i = 0; i < 10; i++) { const c = cell(i); rrect(c.x - 80, c.y - 75, 160, 150, 22, '#FFF6E6', 5); }
      X.restore();
    }
    // apples
    for (let i = 0; i < 10; i++) {
      const [ox, oy] = APPLE_ON_TREE[i], tx = TREE.x + ox * ts, ty = TREE.y + oy * ts;
      const ti = ct0 + i * cst, appear = backOut(prog(t, .8 + i * .12, 1.2 + i * .12));
      const c = cell(i);
      if (t < ti - .15) { if (appear > 0) apple(tx, ty + Math.sin(t * 3 + i) * 3, 34 * appear); }
      else {
        const k = prog(t, ti - .15, ti + .55), e = inOut(k);
        const x = lerp(tx, c.x, e), y = lerp(ty, c.y, e) - Math.sin(Math.PI * k) * 220;
        const land = prog(t, ti + .55, ti + .9), sq = k >= 1 ? Math.sin(land * Math.PI) * (1 - land) * 1.2 : 0;
        let hop = 0; if (t > 33.1 && t < 34.8) hop = Math.abs(Math.sin((t - 33.1) * 9 + i * .5)) * 30;
        apple(x, y - hop, lerp(34, 52, e), sq);
        if (k >= 1 && land < 1) {                                   // number tag pops on landing
          X.save(); X.globalAlpha = 1 - land; label(String(i + 1), c.x, c.y - 70 - land * 60, 64, RAINBOW[i]); X.restore();
        }
      }
    }
    // big counting number badge
    const cur = Math.floor((t - ct0) / cst);
    if (t >= ct0 && t < 33.1) {
      const n = clamp(cur, 0, 9), pk = elastic(prog(t, ct0 + n * cst, ct0 + n * cst + .6));
      X.save(); X.translate(540, 400); X.scale(pk, pk);
      ball(0, 0, 150, '#ffffff', RAINBOW[n], RAINBOW[n], 8);
      shine(-60, -70, 40, 20, .5);
      label(String(n + 1), 0, 10, 190, '#fff', { halo: false, lw: 12 });
      X.restore();
    }
    if (t >= 33.1) { const pk = elastic(prog(t, 33.1, 33.8)); X.save(); X.translate(540, 400); X.scale(pk, pk); rainbowWord('10 apples!', 0, 0, 130); X.restore(); }
    if (t > 2.9 && t < 5.6) {                                        // question bubble
      const q = backOut(prog(t, 2.9, 3.4)) * (1 - prog(t, 5.3, 5.6));
      X.save(); X.translate(470, 420); X.scale(q, q); X.rotate(Math.sin(t * 4) * .08);
      ball(0, 0, 105, '#ffffff', '#FFD23F', '#F4A100', 7); label('?', 0, 8, 150, '#fff', { halo: false, lw: 10 }); X.restore();
    }
    // Pip
    const pin = backOut(prog(t, .15, .75));
    if (pin > 0) pip(215, 760 + (1 - pin) * 900, .92, t, mouth, { wave: (t > .5 && t < 2.8 || t > 5.5 && t < 8.5 || t > 10.3 && t < 13) ? 1 : 0, jump: t > 33.1 && t < 34.8 ? Math.abs(Math.sin((t - 33.1) * 6)) * 80 : 0 });
  }

  if (scene === 'quiz') {
    // stars
    for (let i = 0; i < 4; i++) {
      const [sx, sy] = STARS[i], ap = backOut(prog(t, 35.6 + i * .25, 36.1 + i * .25));
      const ti = qt0 + i * qst, hit = prog(t, ti, ti + .45), pulse = t >= ti ? 1 + Math.sin(hit * Math.PI) * .25 : 1;
      const r = 92 * ap * pulse * (1 + Math.sin(t * 3 + i) * .03);
      if (r > 1) star3d(sx, sy + Math.sin(t * 2 + i) * 8, r, Math.sin(t + i) * .1, t >= ti ? 1 : .35);
      if (t >= ti) label(String(i + 1), sx, sy + 135, 80, RAINBOW[i * 2]);
    }
    // answer area
    X.save();
    const boardY = 1130;
    rrect(FRAME.x + 8, boardY + 12, FRAME.w, FRAME.h, 34, 'rgba(0,0,0,.25)', 0);
    rrect(FRAME.x, boardY, FRAME.w, FRAME.h, 34, '#FFFFFF', 7);
    if (t < 43.3) {
      const q = 1 + Math.sin(t * 6) * .08;
      X.translate(540, boardY + 180); X.scale(q, q);
      label('?', 0, 0, 260, '#9B5DE5', { lw: 14 });
      X.setTransform(1, 0, 0, 1, 0, 0);
    } else {
      const pk = elastic(prog(t, 43.3, 43.9));
      X.translate(540, boardY + 180); X.scale(pk, pk);
      label('4', -170, 0, 260, '#FFC93C', { lw: 14 }); star3d(90, 0, 95, 0, 1); star3d(230, -60, 45, .3, .6);
    }
    X.restore();
    X.save(); X.translate(fx, fy); X.scale(cs, cs); X.translate(-fx, -fy);
    // "think" dots during the pause
    if (t > 37.6 && t < 40.9) for (let i = 0; i < 3; i++) { const on = (t - 37.6) > i * .9; ell(450 + i * 90, 1080, 16, 16, on ? '#FFD23F' : 'rgba(255,255,255,.4)', 4); }
    X.restore();
    pip(215, 760, .92, t, mouth, { look: t > 37.6 && t < 40.9 ? Math.sin(t * 3) : 0, jump: t > 43.3 && t < 44.8 ? Math.abs(Math.sin((t - 43.3) * 6)) * 35 : 0 });
  }

  if (scene === 'party') {
    // balloons 1..10 pop in as they are counted
    for (let i = 0; i < 10; i++) {
      const ti = ft0 + i * fst, a = elastic(prog(t, ti, ti + .5));
      const bx = 150 + (i % 5) * 195, by0 = 470 + Math.floor(i / 5) * 330;
      const rise = t > 54.9 ? Math.pow(prog(t, 54.9 + i * .04, 56.2), 1.5) * 1700 : 0;
      if (a > 0) {
        const col = RAINBOW[i];
        X.save(); X.translate(bx, by0 - rise + Math.sin(t * 2 + i) * 10); X.scale(a, a);
        balloon(0, 0, 80, col, col, i + 1, t); X.restore();
      }
    }
    const jump = t > 55.1 ? Math.abs(Math.sin((t - 55.1) * 5)) * 120 : 0;
    pip(540, 1135, .9, t, mouth, { wave: t < 47.2 || t > 55 ? 1 : 0, jump });
    if (t > 55.7) {
      const pk = elastic(prog(t, 55.7, 56.4));
      X.save(); X.translate(540, 520); X.scale(pk, pk); rainbowWord('You can', 0, -80, 120, 2); rainbowWord('count to 10!', 0, 70, 120, 5); X.restore();
      // confetti
      const r = rnd(11);
      for (let i = 0; i < 140; i++) {
        const sx = r() * W, sp = 300 + r() * 500, ph = r() * 6, c = RAINBOW[i % 10], dt = t - 55.1 - r() * .6;
        if (dt < 0) continue;
        const y = -40 + dt * sp, x = sx + Math.sin(dt * 3 + ph) * 40;
        X.save(); X.translate(x, y); X.rotate(dt * 6 + ph); X.fillStyle = c; X.fillRect(-10, -6, 20, 12); X.restore();
      }
    }
  }

  // ---------------- UI layer (not affected by camera)
  X.setTransform(1, 0, 0, 1, 0, 0);
  const chip = t < 5.5 ? null : t < 35 ? 'Count 1 to 10' : t < 45 ? 'Quiz Time!' : t < 55 ? 'Count super fast!' : null;
  if (chip) {
    const ap = backOut(prog(t, t < 35 ? 5.6 : t < 45 ? 35.2 : 45.2, (t < 35 ? 5.6 : t < 45 ? 35.2 : 45.2) + .5));
    X.save(); X.translate(540, 175); X.scale(ap, ap);
    X.font = '700 70px Fredoka'; const w = X.measureText(chip).width + 90;
    rrect(-w / 2, -58, w, 116, 58, '#FFD23F', 7); label(chip, 0, 4, 70, OUT, { halo: false, lw: 1 });
    X.restore();
  }
  const cap = captionFor(t);
  if (cap) {
    const ln = TL.lines[cap.k], ap = backOut(prog(t, ln.start - .1, ln.start + .25));
    const size = cap.big ? 110 : 66;
    X.save(); X.translate(540, 1625); X.scale(ap, ap);
    X.font = `700 ${size}px Fredoka`; const w = Math.min(1000, X.measureText(cap.text).width + 90);
    rrect(-w / 2, -size * .85, w, size * 1.7, size * .85, 'rgba(255,255,255,.96)', 7);
    label(cap.text, 0, 4, size, cap.color, { halo: false, lw: cap.big ? 8 : 1 });
    X.restore();
  }
  // transition wipes (colorful iris) at scene changes
  for (const T of [35, 45]) {
    const d = Math.abs(t - T);
    if (d < .35) {
      const r = (1 - d / .35) * 1300;
      X.beginPath(); X.arc(540, 960, r, 0, 7); X.fillStyle = T === 35 ? '#9B5DE5' : '#FFC93C'; X.fill();
      X.lineWidth = 16; X.strokeStyle = '#fff'; X.stroke();
      if (r > 200) { X.save(); X.globalAlpha = clamp((r - 200) / 600); star3d(540, 960, 120, t * 2, 0); X.restore(); }
    }
  }
}
window.render = render;
window.setTimeline = tl => { TL = tl; };
</script></body></html>
